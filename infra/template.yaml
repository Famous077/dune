AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Dune — one template, one deploy command. Step 1 of the build order: the single
  DynamoDB table, the repo snapshot bucket, and ApiFn behind an HTTP API.
  Region is ap-south-1 (set in samconfig.toml).

Parameters:
  # `npm run deploy` passes every parameter explicitly, because on an existing stack SAM
  # keeps a parameter's previous value unless told otherwise — a changed default here would
  # never reach the stack. The defaults below only apply to a bare first `sam deploy`; the
  # effective values live in the deploy script in package.json, overridable from .env.
  #
  # Which generator answers questions. Both stay deployable; switching is a redeploy.
  Generator:
    Type: String
    Default: gemini
    AllowedValues: [gemini, groq]

  # Keys are supplied at deploy time from the gitignored .env — see `npm run deploy`.
  # NoEcho keeps them out of CloudFormation output and events. Only the selected
  # generator's key is required; the Rules below refuse a deploy without it, rather than
  # letting it go out blank.
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ''
  GroqApiKey:
    Type: String
    NoEcho: true
    Default: ''

  # Providers retire model ids regularly. When one goes, change these — no code change.
  # A lite model: free-tier gemini-3.6-flash allows only 20 requests a day per project.
  GeminiModel:
    Type: String
    Default: gemini-3.5-flash-lite
  # Model-specific; empty leaves the model's default. `low` keeps free-tier latency down.
  GeminiThinkingLevel:
    Type: String
    Default: low
  GroqModel:
    Type: String
    Default: openai/gpt-oss-120b

  # How much retrieved context goes to the model per question: the doc's ~30,000. The
  # real ceiling is what the provider accepts in one request — Groq's free tier takes
  # 8,000 tokens a minute, which is why Gemini is the default.
  ContextTokenCap:
    Type: Number
    Default: 30000
    MinValue: 1000

Rules:
  GeminiNeedsItsKey:
    RuleCondition: !Equals [!Ref Generator, gemini]
    Assertions:
      - Assert: !Not [!Equals [!Ref GeminiApiKey, '']]
        AssertDescription: Generator is gemini, so GEMINI_API_KEY must be set in .env. Deploy with npm run deploy.
  GroqNeedsItsKey:
    RuleCondition: !Equals [!Ref Generator, groq]
    Assertions:
      - Assert: !Not [!Equals [!Ref GroqApiKey, '']]
        AssertDescription: Generator is groq, so GROQ_API_KEY must be set in .env. Deploy with npm run deploy.

Globals:
  Function:
    # Node 20 was deprecated on 2026-04-30 and fails `sam validate --lint`.
    Runtime: nodejs24.x
    Architectures:
      - arm64
    MemorySize: 1024
    Timeout: 30
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        TABLE_NAME: !Ref DuneTable
        REPO_BUCKET: !Ref RepoBucket
        # Claude from India goes through a global cross-Region inference profile. A plain
        # regional model id fails, and the error is not obvious.
        BEDROCK_MODEL_ID: global.anthropic.claude-sonnet-4-6
        BEDROCK_EMBED_MODEL_ID: amazon.titan-embed-text-v2:0

Resources:
  # ── Storage ────────────────────────────────────────────────────────────────

  # Single table. Every access pattern here is keyed by repoId, so one table and no GSIs.
  # Key layout is in docs/01-BACKEND.md, "DynamoDB design".
  DuneTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: dune
      # On-demand: no capacity planning, scales to zero between demos.
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      # Job records expire after 7 days, which keeps the table clean without a cleanup job.
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Repo snapshots. Objects are deleted after 7 days; there is nothing here worth keeping
  # longer than the weekend.
  RepoBucket:
    Type: AWS::S3::Bucket
    # The stack is torn down after the hackathon. Note that CloudFormation cannot delete a
    # bucket that still holds objects — empty it first if a teardown fails.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      # Bucket names are globally unique, so the account id is appended. The deployed name
      # is in the stack outputs and is passed to the functions as REPO_BUCKET.
      BucketName: !Sub 'dune-repos-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-snapshots
            Status: Enabled
            ExpirationInDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  # ── API ────────────────────────────────────────────────────────────────────

  # HTTP API rather than REST API: cheaper, simpler, and enough for this.
  # CORS is wide open for the weekend — the frontend and the API are on different domains
  # and origin configuration is not where the time goes. The Lambda does not set CORS
  # headers itself; duplicating them here and there is what breaks the browser.
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - '*'
        AllowMethods:
          - '*'

  # One function holds every handler and routes internally. Fewer cold starts, one deploy,
  # one set of permissions. At this scale there is no reason to split it.
  ApiFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../packages/api
      Handler: index.handler
      Description: Dune HTTP API — all handlers, internal routing.
      Environment:
        Variables:
          # The embedding model is bundled into the package (see packages/api/Makefile), so
          # the embedder loads it from here and never downloads at cold start.
          EMBED_MODEL_DIR: /var/task/models
          GENERATOR: !Ref Generator
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL: !Ref GeminiModel
          GEMINI_THINKING_LEVEL: !Ref GeminiThinkingLevel
          GROQ_API_KEY: !Ref GroqApiKey
          GROQ_MODEL: !Ref GroqModel
          CONTEXT_TOKEN_CAP: !Ref ContextTokenCap
          INDEX_FUNCTION_NAME: !Ref IndexFn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DuneTable
        # The source drawer reads files back from the snapshot.
        - S3ReadPolicy:
            BucketName: !Ref RepoBucket
        # POST /v1/repos starts an index job.
        - LambdaInvokePolicy:
            FunctionName: !Ref IndexFn
      Events:
        # Everything reaches the router. Unknown paths come back as a NOT_FOUND in the
        # standard error envelope rather than an API Gateway error page.
        AnyRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: makefile

  # The indexing pipeline, run in one invocation per job — clone, parse, chunk, embed,
  # store. The design is a Step Functions state machine; it was dropped for the weekend
  # (see docs/01-BACKEND.md, "Indexing pipeline"). ApiFn invokes this asynchronously and
  # returns 202; progress reaches the client through the job record.
  IndexFn:
    Type: AWS::Serverless::Function
    Properties:
      # Same artifact as ApiFn, different handler: see packages/api/Makefile.
      CodeUri: ../packages/api
      Handler: indexer.handler
      Description: Dune indexing pipeline — one job per invocation.
      # Memory is also CPU, and embedding is CPU-bound. The Lambda maximum run time.
      MemorySize: 3008
      Timeout: 900
      # Room for a working tree in /tmp; a clone that would exceed it fails loudly.
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          EMBED_MODEL_DIR: /var/task/models
          GRAMMAR_DIR: /var/task/grammars
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DuneTable
        - S3CrudPolicy:
            BucketName: !Ref RepoBucket
      # A failed job records its own failure; an automatic retry would re-run a
      # multi-minute index behind the progress screen's back.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
    Metadata:
      BuildMethod: makefile

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API. Health check is GET {ApiUrl}/v1/health.
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  TableName:
    Description: DynamoDB table name (TABLE_NAME).
    Value: !Ref DuneTable
  RepoBucketName:
    Description: S3 bucket holding repo snapshots (REPO_BUCKET).
    Value: !Ref RepoBucket
